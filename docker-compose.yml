services:
  # ==========================================
  # 1. Unified Nginx Edge Gateway & Web Server
  # ==========================================
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: instaclone_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
    networks:
      - instaclone_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ==========================================
  # 2. Backend Cluster Instance 1 (Node.js Express)
  # ==========================================
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: instaclone_backend1
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - IS_DOCKER=true
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - instaclone_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # 3. Backend Cluster Instance 2 (Node.js Express)
  # ==========================================
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: instaclone_backend2
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - IS_DOCKER=true
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - instaclone_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # 4. PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: instaclone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_DB: ${DB_DATABASE:-InstaClone}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - instaclone_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_DATABASE:-InstaClone}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 5. MongoDB Database
  # ==========================================
  mongodb:
    image: mongo:7
    container_name: instaclone_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - instaclone_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 6. Redis Cache & Message Broker
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: instaclone_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - instaclone_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==========================================
# Custom Bridge Network & Named Persistent Volumes
# ==========================================
networks:
  instaclone_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local